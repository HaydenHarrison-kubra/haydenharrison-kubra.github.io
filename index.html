<template data-page="overview"><div data-type="panel-custom"><p><strong>This guide is the single source of truth for writing clear, consistent, and accessible content across every KUBRA product</strong> — from a single button label to a legal disclosure.</p></div></template>
<template data-page="content-structure"><div data-type="panel-custom"><p><strong>Structure is the scaffolding readers lean on.</strong> This section covers organizing and presenting content in a clear, scannable, and consistent way — helping users find information quickly and understand hierarchy across every KUBRA product.</p></div></template>
<template data-page="foundations"><div data-type="panel-custom"><p><strong>These are the principles that hold everything else up.</strong> This section covers the core writing rules that apply across every surface — voice, tone, content principles, formatting, grammar conventions, and accessibility. When more specific guidance conflicts, start here.</p></div></template>
<template data-page="system-messages"><div data-type="panel-custom"><p><strong>The system talks to users constantly — this is how we make sure it says the right thing, the right way, every time.</strong> This section covers the message types and UI components that carry them: success, error, warning, and informational messages, plus banners, tooltips, modals, and empty states.</p></div></template>
<template data-page="controls-and-inputs"><div data-type="panel-custom"><p><strong>Controls and inputs are where users act</strong> — clicking buttons, choosing from menus, and filling in fields. This section covers how to label these elements so their purpose and outcome are always clear, and how to write options and fields that are consistent and easy to work through.</p></div></template>
<template data-page="forms-and-flows"><div data-type="panel-custom"><p><strong>Forms are where users hand information to us — and where the smallest wording choice has the biggest impact.</strong> This section covers guidance for building clear, accessible forms and writing effective instructional text, from field labels and input types to how and when to guide users through a task.</p></div></template>
<template data-page="compliance-and-legal"><div data-type="panel-custom"><p><strong>When money, consent, or regulation are involved, precision isn't optional.</strong> This section covers the compliance and legal standards content writers must follow across the product — commercial messaging, payment security, legal copy, industry terminology, and trademark usage.</p></div></template>
<template data-page="reference-and-governance"><div data-type="panel-custom"><p><strong>When the rules seem to conflict, this is where you settle it.</strong> This section covers reference material and decision-making guidance that supports the rest of the style guide — abbreviations, official product names, prioritizing conflicting guidance, and related writing resources.</p></div></template>
<template data-page="titles-and-headings"><h2>Titles</h2><p>A title appears at the beginning of a page or section and provides a clear, high-level description of the content that follows.</p><h3>Guidelines</h3><ul><li><p>Use titles to communicate the primary purpose of the page or section</p></li><li><p>Keep titles concise and specific</p></li><li><p>Avoid unnecessary words or filler</p></li><li><p>Ensure titles are meaningful out of context (e.g., in navigation or search results)</p></li></ul><h3>Capitalization</h3><ul><li><p>Use sentence case for page titles</p></li></ul><h3>Punctuation</h3><ul><li><p>Do not use punctuation in titles</p></li><li><p>Exception: Titles may include punctuation if they are written as a question</p></li></ul><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payment settings</em></p></li><li><p><em>Manage workspace access</em></p></li><li><p><em>How do I update my billing information?</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Payment Settings.</em></p></li><li><p><em>Manage your workspace access here</em></p></li></ul></td></tr></tbody></table><h2>Headings and Subheadings</h2><p>Headings and subheadings organize content into scannable, logical sections, helping users quickly find relevant information.</p><h3>Guidelines</h3><ul><li><p>Write headings that clearly describe the content that follows</p></li><li><p>Keep headings concise and specific</p></li><li><p>Use headings to break up dense or complex information</p></li><li><p>Ensure headings are useful when scanned independently</p></li></ul><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payment methods</em></p></li><li><p><em>Update notification settings</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Information</em></p></li><li><p><em>Details</em></p></li></ul></td></tr></tbody></table><h3>Hierarchy</h3><p>Use headings in a clear, nested structure:</p><ul><li><p>H1: Page title</p></li><li><p>H2: Primary sections</p></li><li><p>H3+: Supporting sections</p></li></ul><p>Do not skip heading levels (e.g., H2 → H4).</p><h3>Capitalization</h3><p>Use sentence case for headings and subheadings (capitalize only the first word and proper nouns).</p><h3>Keywords and Clarity</h3><ul><li><p>Include relevant keywords users are likely to search for</p></li><li><p>Avoid vague or generic phrasing</p></li><li><p>Focus on the main idea of the section</p></li></ul><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Error message guidelines</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Important information</em></p></li></ul></td></tr></tbody></table></template>
<template data-page="hyperlinks"><p>Hyperlinks connect users to relevant internal or external resources.</p><h2>General Guidelines</h2><ul><li><p>Link meaningful, descriptive text, not generic phrases</p></li><li><p>Ensure users understand where the link will take them</p></li><li><p>Only link to trusted and relevant resources</p></li></ul><h2>Link Text</h2><ul><li><p>Write the sentence naturally, then link the most relevant words</p></li><li><p>Avoid instructional phrases like "click here"</p></li></ul><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Read the brand guidelines for details</em></p></li><li><p><em>View payment history</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Click here to read the brand guidelines</em></p></li><li><p><em>Click here</em></p></li></ul></td></tr></tbody></table><h2>Articles and Formatting</h2><ul><li><p>Do not include preceding articles (a, an, the, our) in link text</p></li><li><p>Do not include punctuation unless it is part of the official title</p></li></ul><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Read brand guidelines</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Read the brand guidelines</em></p></li></ul></td></tr></tbody></table><h2>Tone and Clarity</h2><ul><li><p>Keep link text concise and specific</p></li><li><p>Avoid vague or ambiguous wording</p></li></ul><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>View account settings</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Learn more</em></p></li></ul></td></tr></tbody></table><h2>Accessibility Considerations</h2><ul><li><p>Link text should make sense out of context (e.g., for screen readers)</p></li><li><p>Avoid using multiple identical link texts for different destinations</p></li></ul><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Download outage report</em></p></li><li><p><em>View outage report history</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Click here (multiple times on a page)</em></p></li></ul></td></tr></tbody></table><h2>When in Doubt</h2><p>If you're unsure how to structure content:</p><ol><li><p>Start with a clear title</p></li><li><p>Break content into logical sections using headings</p></li><li><p>Use tables only when structure improves clarity</p></li><li><p>Link meaningful, descriptive text</p></li></ol><p>Prioritize clarity, scannability, and consistency across all structured content.</p></template>
<template data-page="tables"><p>Tables organize structured data and allow users to quickly compare information.</p><h2>When to Use Tables</h2><p>Use tables when:</p><ul><li><p>Presenting structured or repeatable information</p></li><li><p>Comparing multiple items or attributes</p></li><li><p>Displaying lists with multiple properties</p></li></ul><p>Avoid tables for simple lists or short content.</p><h2>Introducing Tables</h2><ul><li><p>Refer to tables as "this table" or "the table"</p></li><li><p>Do not use "the following table"</p></li></ul><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>This table outlines supported payment methods</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>The following table outlines supported payment methods</em></p></li></ul></td></tr></tbody></table><h2>Naming Tables</h2><ul><li><p>Give tables a clear, descriptive name</p></li><li><p>Ensure users understand what information the table contains</p></li></ul><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Supported payment methods</em></p></li><li><p><em>Error types and resolution steps</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Table #1</em></p></li></ul></td></tr></tbody></table><h2>Column Headings</h2><ul><li><p>Use title case for column headings</p></li><li><p>Keep headings concise and descriptive</p></li></ul><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payment Type | Processing Time | Status</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>payment type | processing time | status</em></p></li></ul></td></tr></tbody></table><h2>Table Content</h2><ul><li><p>Capitalize the first word of each entry</p></li><li><p>Capitalize proper nouns as required</p></li><li><p>Maintain consistent formatting across rows</p></li></ul><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Pending</em></p></li><li><p><em>Completed</em></p></li><li><p><em>EZ-PAY+</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>pending</em></p></li><li><p><em>completed</em></p></li><li><p><em>ez-Pay+</em></p></li></ul></td></tr></tbody></table><h2>Do Not</h2><ul><li><p>Alter capitalization of product names or technical terms</p></li><li><p>Overload tables with excessive content</p></li><li><p>Use tables when a list would be clearer</p></li></ul></template>
<template data-page="accessibility"><h2>Goals for Accessible Copy</h2><p>Accessible UI copy should be perceivable (users can find and understand the content, including with assistive tech), operable (users can complete tasks without relying on a single input type), understandable (instructions and errors are clear and actionable), and robust (content works across browsers, devices, and assistive tech). These map to WCAG's foundational principles.</p><h2>Global Writing Rules That Improve Accessibility</h2><h3>Use plain language without removing necessary precision</h3><p>Prefer common words ("pay", "confirm", "amount due") over internal jargon. When technical terms are required (e.g., "PAN", "CNAME"), define once in context and then stay consistent.</p><h3>Don't rely on formatting, position, or color to convey meaning</h3><p>Avoid instructions like "See the field in red" or "Click the button on the right." Instead, reference the label or component name: "In <strong>Card number</strong>, enter…"</p><h3>Avoid special characters that screen readers may read inconsistently</h3><p>Avoid slashes for choices ("and/or") and quotation marks for emphasis. Prefer full words. See the Special Characters page for full guidance.</p><h2>UI Patterns: What Writers Must Do</h2><h3>1. Labels and controls must be self-explanatory</h3><p>Labels should clearly describe the input (not just the data type). Avoid placeholder-only labeling — placeholders disappear and are not a reliable label substitute.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payment amount</em></p></li><li><p><em>Card expiration date</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Amount</em></p></li><li><p><em>A placeholder acting as a label (e.g., "Enter amount" with no separate label)</em></p></li></ul></td></tr></tbody></table><h3>2. Instructional text must be specific and step-based</h3><p>When users must do something in a particular order or format: use numbered steps for sequences, and give examples for formats (date, email, phone). Avoid "above/below" directionals; refer to field names instead — this also helps screen reader users.</p><h3>3. Error messages must identify the error and help users fix it</h3><p>WCAG requires that errors are identified in text, and (for many contexts) that suggestions are provided. Required for form/field errors: say what went wrong (what field + what issue), and say how to fix it (format, range, required info).</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Routing number must be 9 digits."</em></p></li><li><p><em>"Enter a valid email address in the format name@example.com."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Invalid input"</em></p></li><li><p><em>"Error 404"</em></p></li><li><p><em>"Something went wrong" (unless it's truly unknown and unrecoverable)</em></p></li></ul></td></tr></tbody></table><p><strong>Note:</strong> When the cause is unknown, it's acceptable to attribute it to a system error and provide next steps ("try again later"), but don't leave users without an action.</p><h3>4. Maintain user input whenever possible</h3><p>If a user submits a form and there's an error: do not clear the entire form, keep completed fields intact, and move focus to the error summary or first error. This reduces cognitive load and supports users with motor and cognitive disabilities.</p><h3>5. Authentication and verification flows must be accessible</h3><p>WCAG 2.2 added new success criteria for accessible authentication and redundant entry. If your flows require re-entering data or rely on puzzles or memory-only steps, treat this as an accessibility risk area. Avoid "remember your answer from earlier" as the only path; provide alternatives and clear instructions (especially for MFA, OTP, verification links).</p><h2>Component-Specific Copy Guidance</h2><h3>Buttons and links</h3><p>Use action + object ("Pay bill", "Save payment method"). Avoid "Click here" — it is contextless when read out of context. Link text should describe the destination ("Read the brand guidelines"), not an action cue.</p><h3>Dialogs and confirmation</h3><p>Title states the decision or action. Body explains impact and what happens next. Buttons are explicit (avoid yes/no).</p><h3>Tooltips</h3><p>Don't hide essential instructions only in tooltips. Tooltips should clarify, not carry required content.</p><h2>ARIA and Interaction Patterns</h2><p>Writers aren't responsible for Accessible Rich Internet Applications Suite (ARIA) implementation, but copy decisions affect it. When you see custom components (non-native dropdowns, tabs, accordions, complex tables), align with the ARIA Authoring Practices Guide patterns. Writers should flag interactive elements without labels, icon-only buttons without accessible names, and errors that appear visually but aren't announced in text.</p><h2>Accessibility Checklist for Writers (Ship-Ready)</h2><p>Before you publish UI copy, confirm:</p><ul><li><p>Every control has a clear, unique label</p></li><li><p>Instructions don't rely on color or position ("red", "right side", "above")</p></li><li><p>Error messages identify the field + issue + fix (when possible)</p></li><li><p>Unknown errors give a next step and don't blame the user</p></li><li><p>Link text is meaningful out of context</p></li><li><p>Special characters aren't used as shortcuts for meaning</p></li><li><p>Critical info is not tooltip-only</p></li><li><p>Copy is consistent and predictable across similar flows (helps cognitive accessibility)</p></li></ul></template>
<template data-page="accessibility-high-risk"><p>This covers high-risk user moments in payment and billing flows where unclear or inaccessible copy can cause financial harm, user frustration, or compliance issues. These patterns require extra precision, predictability, and accessibility review.</p><h2>What Qualifies as "High-Risk" Copy</h2><p>A flow is considered high-risk when it involves money movement or authorization, account access or identity verification, irreversible or time-sensitive actions, fees, penalties, or service disruption, or compliance or regulatory disclosure. In these contexts, clarity and accessibility override tone, brevity, and stylistic preference.</p><h2>1. Authentication and Verification (MFA, OTP, Identity Checks)</h2><p><strong>Risks:</strong> cognitive load, memory reliance, time pressure, screen reader interruptions.</p><p><strong>Accessibility requirements:</strong> do not rely on memory alone (WCAG 2.2: Accessible Authentication), provide clear instructions and recovery paths, avoid jargon like "OTP" unless defined.</p><p><strong>Instructional copy:</strong></p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Enter the 6-digit code we sent to your phone number ending in 1234." (Explains what it is, where it came from, and what to do.)</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Enter OTP"</em></p></li><li><p><em>"Check your device"</em></p></li></ul></td></tr></tbody></table><p><strong>Error copy:</strong></p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"The verification code is expired. Request a new code to continue." (Actionable and neutral.)</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Invalid code"</em></p></li><li><p><em>"Authentication failed"</em></p></li></ul></td></tr></tbody></table><p><strong>Recovery</strong> — always include a secondary path: resend code, use a different method, or contact support.</p><h2>2. Payment Failures</h2><p><strong>Risks:</strong> user anxiety, repeated failed attempts, blame perception, duplicate payments.</p><p><strong>Accessibility and UX rules:</strong> clearly state whether money was charged, separate failure reason from next step, avoid emotional or apologetic language.</p><p><strong>Known issue:</strong> "We couldn't process this payment because the card has expired." "Update your card details and try again."</p><p><strong>Unknown issue:</strong> "We couldn't process this payment due to a system error." "No funds were charged. Please try again later."</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Explicit outcome and clear next step</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Something went wrong" (without context)</em></p></li></ul></td></tr></tbody></table><h2>3. Scheduled Payments and Autopay</h2><p><strong>Risks:</strong> unintended charges, missed payments, trust erosion.</p><p><strong>Accessibility requirements:</strong> clearly state when the action occurs, confirm changes in plain language, avoid relative time ("soon", "later").</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Autopay is scheduled to run on March 15 each month."</em></p></li><li><p><em>"Changes to this payment will apply starting April 15."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Your changes were saved"</em></p></li><li><p><em>"Next billing cycle"</em></p></li></ul></td></tr></tbody></table><h2>4. Fees, Penalties, and Charges</h2><p><strong>Risks:</strong> legal exposure, user confusion, perceived deception.</p><p><strong>Accessibility and compliance rules:</strong> do not hide fees behind tooltips alone, avoid vague language ("may apply" unless legally required), use consistent terminology for the same fee.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"A service fee of $2.50 will be added to this payment."</em></p></li><li><p><em>"A late fee may apply if payment is not received by March 20."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Additional charges may occur"</em></p></li><li><p><em>"Small processing fee"</em></p></li></ul></td></tr></tbody></table><h2>5. Refunds, Reversals, and Cancellations</h2><p><strong>Risks:</strong> false expectations, timing disputes, support escalation.</p><p><strong>Accessibility requirements:</strong> clearly state processing time, separate system action from bank action, avoid guarantees unless contractually accurate.</p><p><strong>Refund confirmation:</strong> "Your refund has been initiated." "Funds typically appear in your account within 3 to 5 business days."</p><p><strong>Cancellation:</strong> "This payment has been canceled and will not be processed."</p><table data-width="760"><thead><tr><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #ffebe6"><ul><li><p><em>"Refunded successfully" (without timeline)</em></p></li><li><p><em>"It may take some time"</em></p></li></ul></td></tr></tbody></table><h2>6. Account Lockouts and Security Holds</h2><p><strong>Risks:</strong> panic, repeated failed attempts, accessibility barriers during stress.</p><p><strong>Accessibility and tone rules:</strong> be calm and factual, do not imply wrongdoing, always explain next steps.</p><p><strong>Lockout notice:</strong> "Your account is temporarily locked due to multiple unsuccessful sign-in attempts." "Try again in 15 minutes or reset your password."</p><table data-width="760"><thead><tr><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #ffebe6"><ul><li><p><em>"Suspicious activity detected"</em></p></li><li><p><em>"Your account has been restricted" (without cause)</em></p></li></ul></td></tr></tbody></table><h2>7. Service Disruptions and System Outages</h2><p><strong>Risks:</strong> loss of trust, repeated retries, support overload.</p><p><strong>Accessibility rules:</strong> use banners, not tooltips, state scope and impact, set expectations.</p><p><strong>Banner:</strong> "Some payment services are temporarily unavailable. Please try again later."</p><p><strong>If partial impact:</strong> "Payments by bank transfer are currently unavailable. Card payments are not affected."</p><table data-width="760"><thead><tr><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #ffebe6"><ul><li><p><em>"We're experiencing issues"</em></p></li><li><p><em>"Service disruption detected"</em></p></li></ul></td></tr></tbody></table><h2>Language to Avoid in High-Risk Flows</h2><p>Never use humor or emojis; "Oops", "Uh-oh", "Yikes"; blame ("You entered…"); minimizing language ("Just", "Simply"); or ambiguous timing ("Soon", "Shortly").</p><h2>When to Escalate for Review</h2><p>Escalate copy for accessibility and legal review if it mentions fees, penalties, or refunds; affects account access or identity; blocks a user from completing a payment; changes scheduled or recurring payments; or relates to PCI or regulatory requirements.</p><h2>Accessibility Checklist for High-Risk Copy</h2><p>Before shipping, confirm:</p><ul><li><p>The outcome is explicit (charged / not charged / pending)</p></li><li><p>Timeframes are specific and realistic</p></li><li><p>Errors explain what happened and what to do next</p></li><li><p>Users are not required to remember information</p></li><li><p>Critical info is not tooltip-only</p></li><li><p>Language does not imply fault or judgment</p></li><li><p>Copy works when read aloud by a screen reader</p></li></ul></template>
<template data-page="content-principles"><p>UX content supports users as they complete important, often time-sensitive tasks — such as making payments, managing accounts, and resolving issues.</p><p>These principles apply to all UX writing, regardless of surface or component. When specific rules conflict, these principles should guide decision-making.</p><h2>Be Clear Before Being Polite</h2><p>Clarity is the highest priority in financial and technical experiences. Users should immediately understand: what happened, what it means, what to do next. Avoid softening language at the expense of accuracy.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Payment failed due to an expired card"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"We're sorry, but there was an issue with your payment"</em></p></li></ul></td></tr></tbody></table><h2>Be Predictable and Consistent</h2><p>Users build trust when language behaves the same way across similar experiences. Use the same terminology for the same concepts; follow established patterns for errors, warnings, and success states.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Payment pending" used consistently across banners, tables, and notifications</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Processing," "In progress," and "Almost done" used interchangeably</em></p></li></ul></td></tr></tbody></table><h2>Write for the User's Situation, Not the Interface</h2><p>Users don't think in terms of components. They think in terms of outcomes. Write content based on what the user is trying to do, what just happened, and what they need to do next — not the UI element, internal system names, or implementation details.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Add a payment method to continue"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"This form requires additional information"</em></p></li></ul></td></tr></tbody></table><h2>Reduce Cognitive Load</h2><p>Keep messages concise and scannable; focus on one idea or action per message; break up complex information with headings or steps; avoid unnecessary words or filler.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Enter the billing ZIP code"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Please go ahead and enter the billing ZIP code below"</em></p></li></ul></td></tr></tbody></table><h2>Be Honest and Precise</h2><p>Avoid promises you can't guarantee; state system limitations clearly; be specific about timing, outcomes, and impact.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"This payment will process within 24 hours"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Your payment should process soon"</em></p></li></ul></td></tr></tbody></table><h2>Guide, Don't Lecture</h2><p>Avoid condescending language; don't over-explain obvious steps; explain the "why" only when it helps users succeed.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Select a payment method to continue"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"You must select a payment method before proceeding"</em></p></li></ul></td></tr></tbody></table><h2>Design for Accessibility and Scale</h2><p>Content must work for screen readers, localization and translation, and different levels of technical expertise. Avoid symbol-heavy or compressed language; use full words over shorthand; avoid relying on position ("above/below") to convey meaning.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Select an option from the list"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Select an option above"</em></p></li></ul></td></tr></tbody></table><h2>Take Responsibility Without Assigning Blame</h2><p>We take responsibility for system failures without blaming the user or exposing internal complexity.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"We couldn't process this request due to a system error. Please try again later."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"The request failed because the input was invalid."</em></p></li></ul></td></tr></tbody></table><h2>Prefer Facts Over Emotion in Transactional Moments</h2><p>Payment and billing experiences are not the place for personality or humor. Avoid jokes, emojis, or celebratory language; keep success messages calm and factual; maintain a steady tone even during errors or warnings.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Payment submitted successfully"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"You're all set! 🎉"</em></p></li></ul></td></tr></tbody></table><h2>When Principles Conflict</h2><p>If multiple principles apply: 1) Prioritize clarity, 2) Then accuracy, 3) Then consistency, 4) Then tone. If uncertainty remains, escalate for review rather than introducing a new pattern.</p></template>
<template data-page="formatting"><p>Formatting is how we add structure and emphasis without adding words. Like voice, our approach to formatting stays consistent regardless of context.</p><h2>Principles</h2><h3>Purposeful</h3><p>Every formatting choice must carry meaning. Formatting is a signal, not decoration. If removing the formatting doesn't change the meaning, remove it. Reserve each style for a single, predictable job.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Your payment of <strong>$1,250.00</strong> is due <strong>March 15</strong>."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Your payment is due <strong>soon</strong>, so please make sure to <strong>pay it on time</strong>."</em></p></li></ul></td></tr></tbody></table><h3>Consistent</h3><p>The same kind of information is formatted the same way everywhere. Format amounts, dates, and system states the same way across every surface. Don't mix conventions within a single screen.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Payment pending" · "Payment scheduled" · "Payment completed"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Payment pending" · "PAYMENT SCHEDULED" · "Payment completed"</em></p></li></ul></td></tr></tbody></table><h3>Accessible</h3><p>Formatting must work for screen readers, high-contrast modes, and users who adjust text size. Never rely on styling alone to convey meaning. Pair color or weight with a text label or icon.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Red text and the label "Payment failed."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Red text alone to imply something went wrong.</em></p></li></ul></td></tr></tbody></table><h2>Formatting by Element</h2><p>Each element below has one primary job. Use it for that job only.</p><h3>Bold</h3><p>Bold draws the eye to the single most important piece of information on a screen. Use for critical data users must not miss: amounts, due dates, deadlines. Limit to one idea per screen.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Transfer <strong>$500.00</strong> to your linked account."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Transfer <strong>$500.00</strong> to your <strong>linked account</strong> before the <strong>deadline</strong> shown above."</em></p></li></ul></td></tr></tbody></table><h3>Italics</h3><p>Italics reduce readability and are difficult for many users, including those with dyslexia. Use rarely — acceptable only when referring to a word or term as itself. Never use italics in error, legal, or PCI-related content.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"The status processing means the payment has not yet cleared."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Your payment is still processing and may take some time."</em></p></li></ul></td></tr></tbody></table><h3>Underline</h3><p>Underlines signal links. Nothing else. Never underline for emphasis, or users will read it as a broken or unresponsive link.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"See your full transaction history." (as a link)</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"This payment is <u>final</u> and cannot be reversed."</em></p></li></ul></td></tr></tbody></table><h3>All Caps</h3><p>Never, under any circumstances, use capitalization as a formatting tool. It reads as shouting and is announced awkwardly by screen readers.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Payment failed. Please try again."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"PAYMENT FAILED. PLEASE TRY AGAIN."</em></p></li></ul></td></tr></tbody></table><h3>Monospace / Code</h3><p>Use a monospace style for strings users must read or copy exactly — reference IDs, confirmation codes, and error codes. Do not use monospace for ordinary numbers, amounts, or dates.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Reference your transaction ID <code>TXN-99432</code> when contacting support."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Your payment of <code>$1,250.00</code> is due soon."</em></p></li></ul></td></tr></tbody></table><h3>Color</h3><p>Color reinforces meaning but never carries it alone. Always pair color with text, an icon, or both.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Green checkmark and "Payment completed."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>A green dot with no label to indicate success.</em></p></li></ul></td></tr></tbody></table><h2>Guidelines</h2><h3>Emphasis Restraint</h3><p>Emphasis works only when it's scarce. Limit emphasis to one primary point per screen or message. Don't stack styles (bold and italic and color) on the same element.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Your account will be charged <strong>$49.00</strong> on the 1st of each month."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Your account will be charged <strong>$49.00</strong> on the <strong>1st of each month</strong>."</em></p></li></ul></td></tr></tbody></table><h3>Formatting in Sensitive Content</h3><p>In legal, compliance, and PCI flows, formatting must not introduce ambiguity. Keep legal and compliance text in plain, unstyled prose unless a label is genuinely required.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"You cannot cancel this payment after submission."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"You <strong>cannot</strong> cancel this payment after submission."</em></p></li></ul></td></tr></tbody></table><h3>What to Avoid (Across All Contexts)</h3><ul><li><p>Bolding entire sentences or paragraphs</p></li><li><p>Italics for emphasis</p></li><li><p>Underlines on anything that isn't a link</p></li><li><p>All caps as a substitute for emphasis</p></li><li><p>Color, weight, or styling as the only signal of meaning</p></li><li><p>Mixing formatting conventions within one surface</p></li><li><p>Decorative formatting that adds no meaning</p></li></ul><h3>When in Doubt</h3><ol><li><p>Default to no formatting — plain text is the baseline.</p></li><li><p>Add emphasis only when it changes what the user notices first.</p></li><li><p>Use the element built for the job (bold for emphasis, monospace for codes, underline for links).</p></li><li><p>Match the pattern already used elsewhere in the product.</p></li></ol></template>
<template data-page="nouns"><p>Consistent capitalization helps users understand what is a named product or feature versus a general concept or action. In payment and technical experiences, incorrect capitalization can create confusion, imply functionality that doesn't exist, or suggest a level of formality that isn't intended.</p><p>This section defines how to determine whether a term is a proper noun or a common noun, and how to apply that decision consistently across UI, documentation, and supporting content.</p><h2>Governing Rule</h2><p>Capitalize a term only when it refers to an official, named product, feature, service, or program. If a term describes a behavior, configuration, concept, outcome, or general capability, it should be treated as a common noun and follow standard sentence casing. When in doubt, default to common noun and escalate for confirmation.</p><h2>Proper Nouns (Capitalize)</h2><p>A proper noun refers to a specific, officially named entity that users can identify, select, enable, or manage. <strong>Proper nouns include:</strong> product names, platform tools and services, official program names, branded features, acronyms or abbreviations that represent named systems.</p><p><strong>Proper nouns should:</strong> always use the approved spelling and capitalization, never be altered for sentence flow, be consistent across UI, documentation, and support content.</p><p>For a comprehensive and authoritative list, refer to the KUBRA Product Name Usage and Trademark Guidelines.</p><h2>Common Nouns (Do Not Capitalize)</h2><p>The following terms are not proper nouns and should follow standard sentence casing, even if they are domain-specific or appear technical. <strong>Common nouns include:</strong> general financial concepts, system behaviors or processes, internal classifications or abstractions, features when referenced generically.</p><h2>Descriptor vs. Proper Noun Usage</h2><p>Some terms may appear capitalized in one context and lowercase in another. This distinction depends on how the term is being used, not the words themselves.</p><p><strong>Use sentence case when the term acts as a descriptor.</strong> If the term describes a general action, capability, or outcome, treat it as a common noun.</p><blockquote><p>Enable this setting to receive payment reminders for your contacts.</p></blockquote><p>Here, "payment reminders" describes a behavior, not the named SMS program.</p><p><strong>Use title case when referring to the named feature or program.</strong></p><blockquote><p>Manage Payment Reminders in your notification settings.</p></blockquote><h2>Acronyms and Capitalization</h2><ul><li><p>Acronyms representing named systems or programs are treated as proper nouns and remain fully capitalized.</p></li><li><p>Acronyms that describe general processes or technical concepts follow standard sentence casing rules when spelled out.</p></li></ul><p><strong>Documentation rule:</strong></p><ol><li><p>Spell out the full term on first mention</p></li><li><p>Include the acronym in parentheses</p></li><li><p>Use the acronym consistently thereafter</p></li></ol><blockquote><p>The System Usability Scale (SUS) is used to evaluate usability. SUS results are reviewed quarterly.</p></blockquote><h2>UI-Specific Guidance</h2><p><strong>In UI copy:</strong> use capitalization to signal selectable or configurable entities; avoid capitalizing concepts that users cannot directly act on; do not introduce new capitalization for emphasis.</p><p><strong>In tables, labels, and menus:</strong> preserve official capitalization for proper nouns; do not "normalize" product names to match sentence case; avoid mixing proper and common noun usage in the same UI surface.</p><h2>Approved Proper Noun Usage</h2><table data-width="760"><thead><tr><th><p>Term</p></th><th><p>Notes</p></th></tr></thead><tbody><tr><td><p>Pay-by-Text</p></td><td><p>SMS program name (not "Pay by Text")</p></td></tr><tr><td><p>EZ-PAY</p></td><td><p>Product name (not "EZ-Pay," "EZ PAY," or "Ez Pay")</p></td></tr><tr><td><p>CNAME</p></td><td><p>Abbreviation/acronym (not "Cname" or "cname")</p></td></tr><tr><td><p>Storm Center</p></td><td><p>Product name (not "StormCenter")</p></td></tr><tr><td><p>IncidentWatch</p></td><td><p>Product name (not "Incident Watch")</p></td></tr><tr><td><p>Image Library</p></td><td><p>Platform tool/service name</p></td></tr><tr><td><p>Payable Types</p></td><td><p>Platform tool/service name</p></td></tr><tr><td><p>Retail Cash Payments (RCP)</p></td><td><p>Platform tool/service name</p></td></tr><tr><td><p>Activity Alerts (can be shown as common)</p></td><td><p>SMS program name</p></td></tr><tr><td><p>Payment Reminders (can be shown as common)</p></td><td><p>SMS program name</p></td></tr></tbody></table><h2>Approved Common Noun Usage</h2><table data-width="760"><thead><tr><th><p>Term / Phrase</p></th><th><p>Notes</p></th></tr></thead><tbody><tr><td><p>PAN validation</p></td><td><p>Technical process</p></td></tr><tr><td><p>service fee</p></td><td><p>Financial concept</p></td></tr><tr><td><p>transaction division (TD)</p></td><td><p>Descriptor; capitalize only when starting a sentence</p></td></tr><tr><td><p>workspace</p></td><td><p>Generic UI concept</p></td></tr><tr><td><p>snapshot</p></td><td><p>General system artifact</p></td></tr></tbody></table><h2>What to Avoid</h2><ul><li><p>Capitalizing for emphasis</p></li><li><p>Creating new "informal" variants of product names</p></li><li><p>Inconsistent casing across similar UI surfaces</p></li><li><p>Treating internal terminology as proper nouns without approval</p></li></ul><h2>When in Doubt</h2><ol><li><p>Ask: Is this an official, named product, feature, or program?</p></li><li><p>Ask: Can the user directly select, manage, or configure it?</p></li><li><p>Check the Product Name Usage and Trademark Guidelines</p></li><li><p>Default to sentence case and escalate for confirmation</p></li></ol></template>
<template data-page="plurals"><p>Clear pluralization helps users understand quantity, capability, and expectation — especially in forms, tables, and transactional interfaces. Inconsistent or decorative pluralization can introduce confusion or visual clutter.</p><h2>Governing Principle</h2><p>Pluralization should communicate meaning, not style. Use plurals to clarify: whether one or many items are allowed, whether a list represents a collection, whether an action affects multiple entities. Avoid plurals that exist only to "cover all cases."</p><h2>Standard Plural Usage</h2><p>When a label, heading, or message refers to more than one item, use the standard plural form without punctuation.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payments · Accounts · Transactions</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Payment(s) · Account(s)</em></p></li></ul></td></tr></tbody></table><p>This aligns with Material and Microsoft guidance: parenthetical plurals should be avoided unless they convey functional meaning.</p><h2>Parenthetical Plurals (Limited, Intentional Use)</h2><p>Parenthetical plurals — <code>(s)</code> / <code>(es)</code> — are allowed only when they communicate input flexibility, not when displaying information. Only use <code>(s)</code> when involving actions; read-only content should use the plural version.</p><p><strong>Approved use:</strong> input instructions or placeholders where the field explicitly supports one or multiple values.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Enter keyword(s)</em></p></li><li><p><em>Upload file(s)</em></p></li><li><p><em>Add reference ID(s)</em></p></li></ul></td></tr></tbody></table><p><strong>Do not use parenthetical plurals in:</strong> headings or subheadings, menu items or navigation, button labels, table headers, success/error/warning messages.</p><table data-width="760"><thead><tr><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #ffebe6"><ul><li><p><em>Transaction(s)</em></p></li><li><p><em>Select option(s)</em></p></li><li><p><em>File(s) uploaded successfully</em></p></li></ul></td></tr></tbody></table><h2>Displayed Content vs. Input Content</h2><p><strong>When displaying data.</strong> If the UI displays multiple items (tables, summaries, lists), use the standard plural form.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payment methods · Active workspaces</em></p></li></ul></td></tr></tbody></table><p><strong>When only one item is expected.</strong> Use the singular form, even if future expansion is possible.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payment method</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Payment method(s)</em></p></li></ul></td></tr></tbody></table><h2>Consistency Rules</h2><ul><li><p>Do not mix singular and plural forms within the same UI surface</p></li><li><p>Use the same plural form for the same concept across similar experiences</p></li><li><p>Avoid switching pluralization to solve layout issues — adjust layout instead</p></li></ul></template>
<template data-page="special-characters"><p>Special characters can negatively impact readability, accessibility, localization, and screen reader output. For that reason, they should be used sparingly and intentionally in UI copy.</p><h2>Governing Principle</h2><p>If a word communicates clearly without a special character, do not use one.</p><h2>Slashes ( / )</h2><p>Do not use slashes in UI copy. Slashes are difficult for screen readers and can introduce ambiguity.</p><table data-width="760"><thead><tr><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #ffebe6"><ul><li><p><em>and/or · enable/disable · yes/no</em></p></li></ul></td></tr></tbody></table><p><strong>Approved use:</strong> dates (MM/DD/YYYY), file paths or URLs (when required).</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>03/15/2026</em></p></li></ul></td></tr></tbody></table><h2>Ampersands ( &amp; )</h2><p>Limited use only. Ampersands are acceptable only when writing official business names (e.g., OG&amp;E) or citing external sources or trademarks.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>OG&amp;E</em></p></li><li><p><em>Billing and payments</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Billing &amp; Payments</em></p></li></ul></td></tr></tbody></table><p>Do not use ampersands to save space in UI copy.</p><h2>Quotation Marks ( " " )</h2><p>Avoid quotation marks in UI copy. Quotation marks can confuse screen readers and users.</p><table data-width="760"><thead><tr><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #ffebe6"><ul><li><p><em>Click "Submit"</em></p></li><li><p><em>Select the "Advanced" option</em></p></li></ul></td></tr></tbody></table><p><strong>Approved use:</strong> system-required copy (e.g., Apple Face ID permission modals), referring to external or legal entity names when required.</p><h2>Hyphens and Dashes</h2><p><strong>Hyphens ( - )</strong> — use in approved product names only; do not introduce new hyphenation for readability. <strong>En dashes / em dashes</strong> — avoid in UI copy; acceptable in documentation if necessary.</p><h2>Parentheses ( )</h2><p>Parentheses should be used sparingly and never as a substitute for clarity.</p><p><strong>Approved use:</strong> acronym introduction on first mention, optional clarifying information in documentation.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>System Usability Scale (SUS)</em></p></li></ul></td></tr></tbody></table><p><strong>Avoid using parentheses in UI labels.</strong></p><table data-width="760"><thead><tr><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #ffebe6"><ul><li><p><em>Email address (work)</em></p></li><li><p><em>Amount (USD)</em></p></li></ul></td></tr></tbody></table><h2>What to Avoid</h2><ul><li><p>Parenthetical plurals outside of input instructions</p></li><li><p>Slashes to imply choice</p></li><li><p>Ampersands for brevity</p></li><li><p>Quotation marks for emphasis</p></li><li><p>Special characters used decoratively</p></li></ul><h2>When in Doubt</h2><ol><li><p>Ask whether the plural or character adds meaning</p></li><li><p>Prefer full words over symbols</p></li><li><p>Default to standard plural forms</p></li><li><p>Check accessibility guidelines</p></li><li><p>Escalate if the term affects compliance or product naming</p></li></ol></template>
<template data-page="tone"><p>Tone changes depending on the user's situation, emotional state, and task.</p><h2>Tone by Context</h2><table data-width="760"><thead><tr><th><p>Context</p></th><th><p>Tone</p></th></tr></thead><tbody><tr><td><p>Informational</p></td><td><p>Neutral, concise, factual</p></td></tr><tr><td><p>Success</p></td><td><p>Calm, confirming, understated</p></td></tr><tr><td><p>Error</p></td><td><p>Polite, empathetic, solution-oriented</p></td></tr><tr><td><p>Warning</p></td><td><p>Direct, clear, cautionary</p></td></tr><tr><td><p>Instructional</p></td><td><p>Supportive, confident, step-based</p></td></tr><tr><td><p>Compliance / Legal</p></td><td><p>Precise, formal, unambiguous</p></td></tr></tbody></table><blockquote><p>⚠️ Tone should never introduce surprise, judgment, or emotional intensity — especially in financial flows.</p></blockquote><h2>Writing for Financial and Technical Experiences</h2><p>Because our products involve billing, payments, and system-driven outcomes: avoid emotional language in transactional moments, do not assign blame to the user, be explicit about system limitations or constraints, use consistent terminology for money, timeframes, and system states.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Payment failed" · "Payment pending" · "Processing" · "Scheduled" · "Completed"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Oops" · "Uh-oh" · "Something weird happened" · Overly conversational metaphors</em></p></li></ul></td></tr></tbody></table><h2>Contractions</h2><p>Contractions help language feel natural but must be used carefully.</p><p><strong>Use contractions when:</strong> writing consumer-facing UI, space is limited, the message is informational or confirmational.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"You'll receive a confirmation email."</em></p></li><li><p><em>"We're processing your request."</em></p></li></ul></td></tr></tbody></table><p><strong>Avoid contractions when:</strong> writing legal, compliance, or PCI-related content; writing error messages with legal or financial impact; mixing contracted and non-contracted forms in the same surface.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"You cannot cancel this payment after submission."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"You can't cancel this payment after submission."</em></p></li></ul></td></tr></tbody></table><h2>Empathy Without Apology</h2><p>We acknowledge friction without being overly apologetic. It's okay to recognize inconvenience; avoid excessive apologies or emotional language; do not minimize the impact of errors.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Something went wrong due to a system error. Please try again later."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Sorry about that! We know this is frustrating."</em></p></li></ul></td></tr></tbody></table><h2>What to Avoid (Across All Contexts)</h2><ul><li><p>Slang, emojis, or humor</p></li><li><p>Over-celebratory success messages</p></li><li><p>Vague reassurance without action</p></li><li><p>Passive ambiguity (e.g., "This may have failed")</p></li><li><p>Conversational filler (e.g., "Just," "Simply," "Quickly")</p></li></ul><h2>When in Doubt</h2><ol><li><p>Prioritize clarity over friendliness.</p></li><li><p>Choose neutral over conversational.</p></li><li><p>State facts before offering guidance.</p></li><li><p>Use existing terminology and patterns.</p></li></ol><p>If ambiguity remains, escalate for review rather than inventing a new tone.</p></template>
<template data-page="voice"><p>Voice is what stays the same, regardless of context.</p><h2>Clear and Concise</h2><p>We use plain, straightforward language that minimizes ambiguity and reduces cognitive load. Prefer concrete verbs over abstract phrases; explain technical concepts without oversimplifying or obscuring meaning; avoid unnecessary jargon, define terms when first introduced.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Payment could not be processed due to an expired card."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"There was an issue with your payment method."</em></p></li></ul></td></tr></tbody></table><h2>Trustworthy</h2><p>We handle financial and personal information, so our language must inspire confidence. Be precise and accurate; avoid vague reassurance (e.g., "Don't worry"); state what happened, why it happened (when known), and what happens next.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"This payment will be reflected on your account within 24 hours."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Your payment should show up soon."</em></p></li></ul></td></tr></tbody></table><h2>Human, Not Robotic</h2><p>Professional does not mean cold. We write like people speaking clearly to other people. Use natural sentence structure; prefer straightforward phrasing over legalistic language; use contractions selectively in consumer-facing experiences.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Something went wrong and we failed to process your payment."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Payment processing was unsuccessful."</em></p></li></ul></td></tr></tbody></table></template>
<template data-page="message-types"><h2>Success</h2><p>A success message confirms that a user action completed as expected. Success messages should provide clear confirmation without unnecessary emphasis. They exist to confirm outcomes, reinforce system reliability, and let users move on.</p><h3>Success Message Types</h3><h4>1. Item-Based Success Messages (One of Many)</h4><p>Use when an action affects a single item within a list, collection, or set. Approved templates:</p><ul><li><p><strong>[item type] [item identifier] [action] successfully</strong> — e.g. "Layer Flood Zones added successfully"</p></li><li><p><strong>[item identifier] [item type] [action] successfully</strong> — e.g. "Map view Downtown updated successfully"</p></li><li><p><strong>[item identifier] [action] to [location or section] successfully</strong> — e.g. "Report 0898765 added to workspace successfully"</p></li></ul><p>Include identifiers when ambiguity is possible; choose the structure that reads most naturally; maintain consistency within the same workflow.</p><h4>2. Section-Based Success Messages (One of One)</h4><p>Use when an action affects an entire section, configuration, or system-level setting. Template: <strong>[section name] [action] successfully</strong> — e.g. "Notification preferences updated successfully," "Map settings reset successfully." Avoid restating information already visible on the screen.</p><h3>Structure, Length, and Punctuation</h3><p>Keep success messages concise, focused on a single completed action. Do not use a period if the message is a single sentence or fragment.</p><h3>When to Use Additional Detail</h3><p>Add supporting text only when it helps users understand impact, scope, or timing.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Configuration updated successfully. Changes may take up to 15 minutes to appear across all environments."</em></p></li></ul></td></tr></tbody></table><h3>What to Avoid</h3><ul><li><p>Over-celebratory or congratulatory language</p></li><li><p>Generic confirmations ("Done," "Success")</p></li><li><p>Emotional modifiers ("Great," "Awesome," "Perfect")</p></li><li><p>Multiple actions in a single message</p></li><li><p>Passive constructions that obscure what changed</p></li></ul><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Changes saved successfully"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Your changes were successfully applied"</em></p></li></ul></td></tr></tbody></table><h3>Tone</h3><p>Success messages should be neutral, professional, calm and factual — across all product types, including internal tools.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Layer settings updated successfully"</em></p></li><li><p><em>"Payment submitted successfully"</em></p></li><li><p><em>"Workspace created successfully"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"You're all set!"</em></p></li><li><p><em>"Nice work—everything's done 🎉"</em></p></li></ul></td></tr></tbody></table><h3>Voice</h3><p>Use active voice; be specific about what changed; avoid unnecessary auxiliary verbs when clarity is preserved.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Settings saved successfully"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Your settings have been successfully saved"</em></p></li></ul></td></tr></tbody></table><h2>Error</h2><p>An error message appears after an attempted action fails or cannot be completed. Error messages should clearly explain what went wrong, why it happened (when known), and what the user can do next.</p><h3>Error Severity Types</h3><h4>1. Recoverable Errors (User Can Fix)</h4><p>Occurs when user input is missing, invalid, or incomplete. Use active voice, clearly state what needs to be corrected, avoid blaming language.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Enter a valid billing ZIP code"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Invalid input provided"</em></p></li><li><p><em>"You entered incorrect information"</em></p></li></ul></td></tr></tbody></table><h4>2. Blocking Errors (Action Cannot Continue)</h4><p>Prevents the user from proceeding, often due to permissions, dependencies, or unmet requirements. Explain what is blocking the action and offer next steps.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"You don't have permission to edit this workspace. Contact an administrator to request access."</em></p></li></ul></td></tr></tbody></table><h4>3. System Errors (User Cannot Fix)</h4><p>The system fails or an external dependency is unavailable. Use passive voice, take responsibility on behalf of the system, set expectations clearly, avoid exposing internal details.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Standard message</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Something went wrong due to a system error. Please try again later."</em></p></li></ul></td></tr></tbody></table><h3>Tone and Voice</h3><p>Error messages should be polite and empathetic, calm and professional, neutral in emotional intensity. Prefer clear, direct language; use passive voice selectively when cause is unknown; use active voice when the user can fix the issue.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"We couldn't load this map due to a system error"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Uh-oh! Something went wrong"</em></p></li></ul></td></tr></tbody></table><h3>What to Avoid</h3><ul><li><p>Generic errors like "Error 404" or "Request failed"</p></li><li><p>Overloading messages with technical detail</p></li><li><p>Blaming the user</p></li><li><p>Leaving users without a clear next step</p></li><li><p>Apologizing excessively</p></li></ul><h3>Inline Errors</h3><p><strong>Pattern 1 — Required Field:</strong> "Card number is required." <strong>Pattern 2 — Format Error:</strong> "Card number must be 16 digits." <strong>Pattern 3 — Constraint Error:</strong> "Payment amount must be greater than $0." <strong>Pattern 4 — System/Validation Error:</strong> "We couldn't verify this account. Check the details and try again."</p><h4>Placement and Timing</h4><p>Inline errors must appear near the affected field and be visually associated with the input — not require scrolling. They should appear on blur or on submission, not while typing.</p><h4>High-Risk Payment Error Patterns</h4><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><p><strong>Payment amount:</strong> "Enter an amount greater than $0" · "Payment amount exceeds your available balance"</p><p><strong>Card information:</strong> "Card number must be 16 digits" · "Expiration date is invalid"</p><p><strong>Routing number:</strong> "Routing number must be 9 digits"</p><p><strong>Verification codes:</strong> "The verification code is expired. Request a new code."</p></td></tr></tbody></table><h4>Inline Errors vs. System/Banner Errors</h4><p>Inline errors are field-level; banner/system errors are page or system-level. Do not use inline errors for API outages, payment system failures, or global form errors.</p><h2>Warning</h2><p>A warning message alerts users to a potential risk, significant change, or irreversible outcome before an action is taken.</p><h3>Tone and Voice</h3><p>Direct, neutral, cautionary without being alarming. Use active voice; address the action and its impact clearly.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Deleting this layer will remove it from all map views"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Warning! This action is dangerous!"</em></p></li></ul></td></tr></tbody></table><h3>When to Use a Warning Message</h3><p>Use when an action may result in data loss, causes a significant change that cannot be easily undone, affects multiple users/systems/environments, or has downstream impact not immediately visible.</p><h3>Warning Banners vs. Confirmation Dialogs</h3><p><strong>Warning banners</strong> — reversible or low-to-moderate risk, user can continue without immediate confirmation. <strong>Confirmation dialogs</strong> — destructive or irreversible, significant impact, explicit confirmation required.</p><h3>Structure and Content</h3><p>Keep warnings short (3 lines or fewer), focused on one risk. Clearly state the risk, name the impacted item, keep close to the affected action.</p><h2>Informational</h2><p>An informational message provides context, status, or guidance without indicating success, failure, or risk.</p><h3>Tone and Voice</h3><p>Neutral, calm, factual. Use clear, declarative, active language.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Map data refreshes every 15 minutes"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Map data may refresh from time to time"</em></p></li></ul></td></tr></tbody></table><h3>Message Type Comparison</h3><table data-width="760"><thead><tr><th><p><strong>Message Type</strong></p></th><th><p><strong>Purpose</strong></p></th><th><p><strong>Timing</strong></p></th></tr></thead><tbody><tr><td><p>Informational</p></td><td><p>Provide context or guidance</p></td><td><p>Before or during an action</p></td></tr><tr><td><p>Warning</p></td><td><p>Highlight potential risk</p></td><td><p>Before an action</p></td></tr><tr><td><p>Error</p></td><td><p>Indicate failure</p></td><td><p>After an action</p></td></tr><tr><td><p>Success</p></td><td><p>Confirm completion</p></td><td><p>After an action</p></td></tr></tbody></table><h3>When Not to Use an Informational Message</h3><p>Do not use when an action failed (use error), succeeded (use success), has potential data loss (use warning), or confirmation is required (use a dialog).</p></template>
<template data-page="banners"><p>A banner is a persistent, system-level message that appears within a page or workflow to communicate important information. Banners persist for the duration of a session or until dismissed, and should be used sparingly to avoid message fatigue.</p><h2>When to Use a Banner</h2><p>Use a banner when the message affects multiple elements on the page, is not tied to a single field or control, needs to remain visible as the user continues working, or applies to the current session or state. <strong>Examples:</strong> system maintenance notices, page-level errors, global configuration changes, non-blocking warnings or informational updates.</p><h2>When Not to Use a Banner</h2><p>Do not use a banner when the message applies to a single field (use inline messaging), immediate confirmation is required (use a dialog), the outcome is obvious, or the message would duplicate another message type.</p><h2>Structure and Length</h2><p>Keep banners concise and focused, ideally no more than 3 lines, one idea or action. Longer explanations should move to inline content, linked help articles, or modals.</p><h2>Headers in Banners</h2><p>Use a header only when additional detail is necessary.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Maintenance in progress. Some features may be unavailable until 2:00 AM ET."</em></p></li></ul></td></tr></tbody></table><h2>Actions and Links in Banners</h2><p>Include a CTA only if the user needs to act; keep CTAs short (1–2 words); use action-oriented verbs.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>View details</em></p></li><li><p><em>Retry</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>OK</em></p></li></ul></td></tr></tbody></table><h2>Punctuation</h2><p>Do not use a period if the banner message is a single sentence or fragment. Use punctuation only for multiple sentences or clarity.</p><h2>Placement</h2><p>Place banners at the top of the affected page or section, visually close to the content they reference, avoiding obscuring primary actions.</p></template>
