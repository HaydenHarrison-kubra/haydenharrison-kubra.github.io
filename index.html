<template data-page="tooltips"><p>A tooltip is a small, contextual overlay that provides additional information when a user hovers over or taps an element. Tooltips are used to clarify specific UI elements, not to deliver critical instructions or system messages. Users must be able to complete tasks without relying on tooltips.</p><h2>Purpose of a Tooltip</h2><p>A tooltip should clarify a label, icon, or control; define unfamiliar terminology; provide concise, supporting information. Tooltips are supplemental — they should not introduce new workflows or required steps.</p><h2>When to Use a Tooltip</h2><p>Use when a label or icon may be unclear, a term requires brief explanation, or a compact interface limits space for inline explanation. <strong>Examples:</strong> explaining a technical field (e.g., CNAME), clarifying a system state, defining domain-specific terminology.</p><h2>When Not to Use a Tooltip</h2><p>Do not use when the information is critical to task completion, the message contains more than a few short lines, a warning/error/confirmation is required, or the information should be permanently visible. FANG guidelines discourage using tooltips for essential instructions because they are hidden by default and not always accessible on mobile.</p><h2>Tone</h2><p>Neutral, informative, concise. Avoid conversational phrasing, filler, or promotional tone.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Required for domain verification"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"You'll want to make sure this is filled out correctly!"</em></p></li></ul></td></tr></tbody></table><h2>Structure, Length, and Punctuation</h2><p>Keep tooltips short (ideally 1–3 lines, maximum 5), one idea per tooltip. Follow banner punctuation rules; avoid exclamation points.</p><h2>Content Guidelines</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p>Explain what the element does</p></li><li><p>Define unfamiliar terms</p></li><li><p>Keep language concrete and direct</p></li><li><p>Make icon tooltips actionable when appropriate</p></li></ul><p><em>"Determines how often the data refreshes" · "Unique identifier assigned to this workspace"</em></p></td><td style="background-color: #ffebe6"><ul><li><p>Repeat the visible label</p></li><li><p>Include unnecessary background information</p></li><li><p>Add links or formatted text</p></li><li><p>Rely on tooltips for compliance disclosures</p></li><li><p>Overload the tooltip with technical detail</p></li></ul></td></tr></tbody></table><h2>When in Doubt</h2><ol><li><p>Ask whether the information is optional</p></li><li><p>Confirm the user can complete the task without it</p></li><li><p>Ensure the explanation can be concise</p></li></ol><p>If the information is essential, use inline text instead.</p></template>
<template data-page="modals-and-confirmation-dialogs"><p>A modal interrupts the current workflow to require user attention or confirmation before proceeding. Confirmation dialogs are a specific type of modal used when an action may result in significant change, data loss, or irreversible impact. Because modals block progress, they should be used intentionally and sparingly.</p><h2>When to Use a Confirmation Dialog</h2><p>Use when an action permanently deletes data, removes access or permissions, cancels payments or scheduled actions, affects multiple users/systems/environments, or cannot be easily undone. <strong>Examples:</strong> deleting a workspace, cancelling a scheduled payment, resetting map configurations, removing a shared access role.</p><h2>When Not to Use a Modal</h2><p>Do not use when the action is low-risk and reversible, a warning banner is sufficient, the action is expected and routine, or the confirmation exists only to "double check."</p><h2>Structure of a Confirmation Dialog</h2><p>A confirmation dialog typically includes a title, body copy, primary CTA, and secondary CTA.</p><h3>Title</h3><p>State the action or consequence directly; be short and clear; avoid conversational phrasing. Do not ask "Are you sure?" — instead, state the action.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Delete workspace?"</em></p></li><li><p><em>"Cancel scheduled payment?"</em></p></li><li><p><em>"Remove user access?"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Are you sure?"</em></p></li></ul></td></tr></tbody></table><h3>Body Copy</h3><p>Explain the consequences, clarify scope, and indicate whether the action is reversible. Keep it concise and factual.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Deleting this workspace will permanently remove all associated reports and user access."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"This action may have consequences you should consider carefully."</em></p></li></ul></td></tr></tbody></table><h3>Primary and Secondary CTAs</h3><p><strong>Primary CTA</strong> — use a verb that clearly reflects the action: Delete, Cancel payment, Remove access. <strong>Secondary CTA</strong> — use "Cancel" for most interactions, or "Go back" when the primary action includes the word "Cancel," to prevent confusion (e.g., Primary: "Cancel payment" · Secondary: "Go back").</p><h3>Full Examples</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><p><strong>Title:</strong> Delete workspace?</p><p><strong>Body:</strong> Deleting this workspace will permanently remove all associated data.</p><p><strong>Primary:</strong> Delete &nbsp; <strong>Secondary:</strong> Cancel</p></td><td style="background-color: #ffebe6"><p><strong>Title:</strong> Are you sure you want to proceed?</p><p><strong>Buttons:</strong> Yes / No</p></td></tr></tbody></table><h2>Tone</h2><p>Direct, neutral, and serious when appropriate. Avoid emotional language, alarmist phrasing, and humor.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"This action cannot be undone."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"This is your last chance!"</em></p></li></ul></td></tr></tbody></table><h2>When in Doubt</h2><ol><li><p>Assess whether the action is reversible</p></li><li><p>Evaluate potential impact or data loss</p></li><li><p>Determine whether the user would reasonably expect confirmation</p></li></ol></template>
<template data-page="empty-states"><p>An empty state appears when a page, table, or section has no data to display. Empty states should be clear, instructive, and actionable, and should never leave users wondering whether something is broken.</p><h2>Types of Empty States</h2><h3>1. First-Time Empty State (Onboarding)</h3><p>Occurs when a user has not yet created or configured anything. <strong>Goal:</strong> encourage setup or creation.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"No workspaces yet" — Create workspace</em></p></li><li><p><em>"No saved payment methods" — Add payment method</em></p></li></ul></td></tr></tbody></table><h3>2. No Results Empty State (Filtered/Search)</h3><p>Occurs when a search or filter returns no matches. <strong>Goal:</strong> help users adjust input. Avoid implying system failure.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"No [thing] found. Try adjusting your filters or search terms."</em></p></li></ul></td></tr></tbody></table><h3>3. System-Limited Empty State</h3><p>Occurs when data is unavailable due to configuration, permissions, or environment limitations. If the issue blocks progress, escalate to an error instead.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"No data available for this date range"</em></p></li><li><p><em>"You don't have access to this workspace"</em></p></li></ul></td></tr></tbody></table><h2>Tone</h2><p>Neutral, supportive, direct. Avoid humor, filler, or marketing tone.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"No reports available"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Looks like it's a little empty in here!"</em></p></li></ul></td></tr></tbody></table><h2>Structure</h2><p>Can include a short header, supporting body text (optional), and a primary CTA (if action is possible).</p><h3>Simple Empty State (Single Sentence)</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"No transactions available"</em></p></li></ul></td></tr></tbody></table><h3>Instructional Empty State (Header + Body + CTA)</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><p><strong>Header:</strong> No map layers added</p><p><strong>Body:</strong> Add a layer to display data on the map.</p><p><strong>CTA:</strong> Add layer</p></td></tr></tbody></table><h2>CTAs in Empty States</h2><p>Use clear, action-driven verbs; keep CTAs short (1–2 words); avoid vague CTAs like "OK" or "Learn more."</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Add layer</em></p></li><li><p><em>Create report</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Get started now!</em></p></li></ul></td></tr></tbody></table><h2>What to Avoid</h2><ul><li><p>Vague statements ("Nothing here yet")</p></li><li><p>Emotional tone</p></li><li><p>Over-explaining system behavior</p></li><li><p>Repeating visible UI labels</p></li><li><p>Using empty states to promote unrelated features</p></li></ul></template>
<template data-page="buttons-and-ctas"><p>Buttons initiate actions. In payment and billing flows, they often authorize transactions, confirm irreversible changes, or move users forward in critical processes. Button copy must be clear, action-driven, specific, consistent, and unambiguous about impact.</p><h2>Use Clear, Action-Oriented Language</h2><p>Buttons should describe what will happen when selected, not what the user is doing. Generic CTAs increase uncertainty in financial flows.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Pay bill</em></p></li><li><p><em>Save changes</em></p></li><li><p><em>Confirm payment</em></p></li><li><p><em>Download statement</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Submit</em></p></li><li><p><em>Continue</em></p></li><li><p><em>OK</em></p></li><li><p><em>Done</em></p></li></ul></td></tr></tbody></table><h2>Keep Button Text Concise</h2><p>Aim for 1–2 words, maximum 3 when necessary for clarity; avoid punctuation unless required.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Cancel payment</em></p></li><li><p><em>Add payment method</em></p></li><li><p><em>View details</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Click here to continue</em></p></li><li><p><em>Proceed to the next step</em></p></li></ul></td></tr></tbody></table><h2>Use Sentence Case</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Pay bill</em></p></li><li><p><em>Save payment method</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Pay Bill</em></p></li><li><p><em>PAY BILL</em></p></li></ul></td></tr></tbody></table><h2>Primary and Secondary Buttons</h2><p><strong>Primary</strong> represents the main action — must clearly state the primary outcome, never vague. <strong>Secondary</strong> is used for cancellation or navigation away: use "Cancel" or "Go back." If the primary action is "Cancel payment," the secondary should be "Go back" to prevent ambiguity.</p><h2>Destructive or Irreversible Actions</h2><p>The label must clearly state the consequence; avoid generic confirmation labels.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Delete payment method</em></p></li><li><p><em>Cancel scheduled payment</em></p></li><li><p><em>Remove bank account</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Confirm</em></p></li><li><p><em>Delete (without object — the object must be included)</em></p></li></ul></td></tr></tbody></table><h2>Avoid "Yes" and "No" Buttons</h2><p>Yes/No buttons are ambiguous and inaccessible when read out of context. Use buttons like <strong>Confirm payment</strong> and <strong>Cancel payment</strong>.</p><h2>Accessibility Considerations</h2><p>Buttons must be keyboard accessible, have clear accessible names, and make sense when read aloud independently — not relying on surrounding text.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>View transaction details</em></p></li><li><p><em>Read terms and conditions</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Click here</em></p></li><li><p><em>Learn more</em></p></li><li><p><em>Continue</em></p></li></ul></td></tr></tbody></table><h2>Avoid the Word "Click"</h2><p>Do not use "click" in button copy — users may be on mobile or assistive devices, and the button already implies interaction.</p><h2>Tone, Hierarchy, and Length</h2><p>Button copy should be direct, neutral, calm, confident — transactional, not conversational. Use consistent terminology for the same action across the product. Don't shorten buttons to fit layout at the expense of clarity.</p></template>
<template data-page="menus"><h2>Dropdown Structure</h2><p>A dropdown includes a field label, a placeholder or default value, and a list of options. Each component must be clear and consistent.</p><h2>Field Label</h2><p>Sentence case, neutral noun phrase, no punctuation, no verbs, no instructional phrasing.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payment method</em></p></li><li><p><em>Country</em></p></li><li><p><em>Billing frequency</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Choose payment method</em></p></li><li><p><em>Select a country</em></p></li><li><p><em>Billing Frequency</em></p></li></ul></td></tr></tbody></table><h2>Dropdowns</h2><p>Use when there are more options than can be displayed as radio buttons, only one option can be selected, and the choice is not time-sensitive or high-risk. If the decision has financial impact, use radio buttons instead.</p><h2>High-Risk Payment Dropdowns</h2><h3>1. Payment Method</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Label: Payment method</em></p></li><li><p><em>Placeholder: Select a payment method</em></p></li><li><p><em>Options: Credit card, Bank account (ACH), PayPal</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Card</em></p></li><li><p><em>Bank</em></p></li><li><p><em>ACH (unless defined for that audience)</em></p></li></ul></td></tr></tbody></table><h3>2. Account Selection</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Checking account ending in 1234</em></p></li><li><p><em>Savings account ending in 5678</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Checking</em></p></li><li><p><em>Savings (ambiguity increases financial risk)</em></p></li></ul></td></tr></tbody></table><h3>3. Date or Billing Cycle</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>One-time payment</em></p></li><li><p><em>Recurring monthly payment</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Monthly</em></p></li><li><p><em>One-time</em></p></li></ul></td></tr></tbody></table><h2>Placeholder Text</h2><p>Must begin with "Select," clearly indicate the action required, and not repeat the label verbatim.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Label: Country → Placeholder: Select a country</em></p></li><li><p><em>Label: Payment method → Placeholder: Select a payment method</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Choose one</em></p></li><li><p><em>Please select</em></p></li></ul></td></tr></tbody></table><h2>Alphabetical and Logical Ordering</h2><p>Organize dropdown options alphabetically (countries, names, static lists), chronologically (date ranges), by frequency of use, or by order of importance. Be consistent across similar dropdowns.</p><h2>Option Labels</h2><p>Sentence case, parallel in structure, concise, clear when read independently — typically noun phrases.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Credit card</em></p></li><li><p><em>Bank transfer</em></p></li><li><p><em>PayPal</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Pay with credit card</em></p></li><li><p><em>Use bank transfer</em></p></li><li><p><em>PayPal option</em></p></li></ul></td></tr></tbody></table><h2>When to Use a Dropdown vs. Radio Buttons</h2><p>Use a dropdown when there are more than ~5–7 options, screen space is limited, or options don't require comparison. Use radio buttons when there are fewer options, financial consequences differ, or comparison improves clarity. In payment flows, default to radio buttons when a decision affects money movement.</p></template>
<template data-page="lists"><p>Lists should make complex information easier to scan, never harder to interpret. In payment systems, clarity in lists directly supports trust and accuracy.</p><h2>Bulleted Lists</h2><p>Use when items can appear in any order, do not represent sequence, and do not imply priority. <strong>Examples:</strong> features, benefits, filter options, system capabilities.</p><h2>Numbered Lists</h2><p>Use when items must be completed in order, represent a sequence, or indicate ranking or priority. <strong>Examples:</strong> payment steps, verification process, setup instructions. Do not use numbered lists for unordered content.</p><h2>Consistency Is Mandatory</h2><p>All items within a list must follow the same grammatical structure — choose all sentence fragments, or all complete sentences. Never mix.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Enter your payment details</em></p></li><li><p><em>Review the transaction summary</em></p></li><li><p><em>Confirm the payment</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Enter your payment details</em></p></li><li><p><em>Review the transaction summary.</em></p></li><li><p><em>Confirm the payment (no mixing punctuation or form)</em></p></li></ul></td></tr></tbody></table><h2>Capitalization</h2><p>Capitalize the first letter of the first word in each item; use sentence case unless proper nouns apply.</p><h2>List Length</h2><p>Lists should be concise and avoid long paragraphs. If a list item exceeds two lines, reconsider structure — use subheadings for complex content.</p><h2>Parallel Structure</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>One-time payment</em></p></li><li><p><em>Recurring monthly payment</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Pay once</em></p></li><li><p><em>Recurring monthly payment (each item must follow the same grammatical pattern)</em></p></li></ul></td></tr></tbody></table><h2>Accessibility Considerations</h2><p>Use semantic HTML (not visually formatted text); don't rely on visual indentation alone; avoid positional references ("first option above"). For numbered lists, don't refer to items by number in body text.</p><h2>Error Summary Lists</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Card number must be 16 digits.</em></p></li><li><p><em>Expiration date is required.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Invalid input</em></p></li><li><p><em>Please correct the errors below</em></p></li></ul></td></tr></tbody></table><h2>Instructional Lists</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ol><li><p><em>Enter your payment details.</em></p></li><li><p><em>Review the transaction summary.</em></p></li><li><p><em>Confirm the payment.</em></p></li></ol></td><td style="background-color: #ffebe6"><ul><li><p><em>First, enter your payment details…</em></p></li><li><p><em>Then review the transaction summary…</em></p></li><li><p><em>Finally, confirm the payment</em></p></li></ul></td></tr></tbody></table><h2>Avoid These Common Mistakes</h2><ul><li><p>Mixing fragments and sentences</p></li><li><p>Inconsistent punctuation</p></li><li><p>Overly long list items</p></li><li><p>Vague or abstract phrasing</p></li><li><p>Referring to list position instead of content</p></li><li><p>Using decorative symbols</p></li></ul></template>
<template data-page="forms"><p>This section covers form-wide principles and guidance specific to each input type: field labels, placeholder text, checkboxes, radio buttons, and toggles.</p><h2>Form Titles</h2><p>Form titles should clearly describe the purpose of the form, stay concise, and use title case.</p><h2>Field Labels</h2><p>Field labels identify the data being entered. They are always visible and are never replaced by placeholder text. Use nouns or noun phrases (not actions), sentence case, no articles or trailing punctuation unless needed.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Card number</em></p></li><li><p><em>Billing address</em></p></li><li><p><em>Payment amount</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Primary account number (unless the audience is technical/admin)</em></p></li><li><p><em>Enter billing address</em></p></li><li><p><em>The account number:</em></p></li></ul></td></tr></tbody></table><h3>Tone in Payment and Compliance Flows</h3><p>Field labels should sound factual, not conversational. Avoid second-person phrasing ("your"), urgency, and marketing language.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payment amount</em></p></li><li><p><em>Account number</em></p></li><li><p><em>Expiration date</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>How much do you want to pay?</em></p></li><li><p><em>Customer financial identifier</em></p></li><li><p><em>Secure payment amount</em></p></li></ul></td></tr></tbody></table><h3>Accessibility</h3><p>Labels must be programmatically associated with their input, stay visible at all times, and make sense when read alone — avoid positional language ("above," "below").</p><h2>Placeholder Text</h2><p>Labels identify the field. Placeholders guide input. Placeholder text disappears — important information must not. Use it to show format or a valid example, never to explain concepts or replace helper text.</p><h3>Format Examples</h3><ul><li><p>Dates: MM/DD/YYYY</p></li><li><p>Time: HH:MM</p></li><li><p>Phone: (XXX) XXX-XXXX</p></li><li><p>Email: name@example.com (generic, non-real)</p></li><li><p>Currency: 100.00 (no symbol unless the field requires one)</p></li><li><p>Search: Search transactions</p></li><li><p>Dropdowns: Select a payment method</p></li></ul><p><em>Avoid vague prompts ("Enter date," "Choose one," "Type here") and real-looking examples ("4111 1111 1111 1111").</em></p><h3>Singular vs. Plural</h3><p>Use parenthetical pluralization only when a field genuinely accepts one or multiple values — "Enter keyword(s)," "Upload file(s)." When multiple values are always expected, use the standard plural — "Add tags," not "Add tag(s)."</p><h3>Accessibility</h3><p>Placeholder text isn't reliably announced by screen readers, disappears once typing starts, and has lower contrast by default. Never put required instructions only in a placeholder.</p><h2>Checkboxes</h2><p>Let users select one or more independent options. Use when the user can select zero, one, or multiple options and the action doesn't need immediate confirmation. For mutually exclusive choices, use radio buttons.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Save payment method for future use</em></p></li><li><p><em>Receive payment reminders</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>SAVE PAYMENT METHOD FOR FUTURE USE</em></p></li><li><p><em>Service fee (unclear what checking it does)</em></p></li></ul></td></tr></tbody></table><p>Add helper text beneath checkboxes with financial or technical implications. The clickable area must include both the checkbox and its full label text; avoid vague labels like "I agree" or "Yes" without context.</p><h2>Radio Buttons</h2><p>Use when only one option can be selected and all options should be visible at once. Group labels are neutral and descriptive, never phrased as a question.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payment method</em></p></li><li><p><em>Credit card</em></p></li><li><p><em>Bank transfer</em></p></li><li><p><em>PayPal</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>How would you like to pay?</em></p></li><li><p><em>Bill me monthly</em></p></li></ul></td></tr></tbody></table><p>When options carry different financial impact, that difference must be explicit — add helper text if context alone doesn't clarify.</p><h2>Toggles</h2><p>Turn a persistent setting on or off. Use only when the setting is independent, reversible, and the change is immediate or clearly saved.</p><h3>Label the State Being Enabled, Not the Action</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Enable autopay</em></p></li><li><p><em>Receive payment reminders</em></p></li><li><p><em>Use paperless billing</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Turn on autopay</em></p></li><li><p><em>Disable autopay</em></p></li><li><p><em>Enable autopay (On)</em></p></li></ul></td></tr></tbody></table><p>Avoid toggles for destructive actions, one-time confirmations, payment submissions, or legal acknowledgment — use a confirmation dialog or explicit button instead.</p><h2>Helper Text</h2><p>Use when input format is complex, the field has financial or legal implications, or extra explanation improves accuracy. Keep it neutral and factual; don't duplicate the label.</p><h2>Required vs. Optional Fields</h2><p>Don't label every field "required." Indicate optional fields when needed, and note required selections at the form level.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Phone number (optional)</em></p></li><li><p><em>Form-level instruction: "You must accept the Terms and Conditions to continue."</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Payment Method (required)</em></p></li><li><p><em>*Payment Method</em></p></li><li><p><em>Asterisk-only indicators</em></p></li></ul></td></tr></tbody></table><h2>Accessibility</h2><p>Forms must be fully keyboard navigable, use visible and persistent labels, associate labels programmatically with inputs, provide clear and actionable error messages, and never rely on color or position for meaning.</p></template>
<template data-page="instructional-text"><p>Instructional text tells users what to do — beyond what a label, placeholder, or button already communicates.</p><h2>When to Use</h2><p>Use when the task is complex, the user may make errors, system behavior is not obvious, or the action has financial or technical implications. Do not use instructional text for obvious actions.</p><h2>Be Direct and Active</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Enter your payment details to continue.</em></p></li><li><p><em>Review the transaction summary.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Continue to proceed</em></p></li><li><p><em>Your billing address must be entered</em></p></li></ul></td></tr></tbody></table><h2>Keep It Short and Focused</h2><p>Use the fewest words needed, avoid long paragraphs, and break complex instructions into steps. If more than one action is required, use a list.</p><h2>Instruction Formats</h2><h3>Single-Line</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Select a payment method.</em></p></li><li><p><em>Enter the amount you want to pay.</em></p></li></ul></td></tr></tbody></table><h3>Multi-Step</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ol><li><p><em>Enter your payment details.</em></p></li><li><p><em>Review the transaction summary.</em></p></li><li><p><em>Confirm the payment.</em></p></li></ol></td><td style="background-color: #ffebe6"><ul><li><p><em>First, enter your payment details…</em></p></li><li><p><em>Then review the transaction summary…</em></p></li></ul></td></tr></tbody></table><h3>Inline (Per Field)</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Enter your account number without spaces.</em></p></li><li><p><em>Use MM/DD/YYYY format.</em></p></li></ul></td></tr></tbody></table><h2>Explain the "Why" When Necessary</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Enter your routing number to process bank payments.</em></p></li><li><p><em>Verify your email address to secure your account.</em></p></li></ul></td></tr></tbody></table><h2>Avoid Redundancy</h2><p>Instructional text should add value, not duplicate field labels, placeholder text, or button labels.</p><h2>Directional Language</h2><p>Avoid positional references that rely on layout — use specific references instead.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Select Confirm payment.</em></p></li><li><p><em>Enter your details in Card number.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Click the button below</em></p></li><li><p><em>See the field on the right</em></p></li></ul></td></tr></tbody></table><h2>Voice and Tone</h2><p>Neutral, clear, supportive, direct — functional, not promotional. Second person ("you") is fine when it improves clarity, but avoid conversational filler or marketing language.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Enter your payment details.</em></p></li><li><p><em>Select your account.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Let's get started</em></p></li><li><p><em>Just follow these steps</em></p></li><li><p><em>Please enter your details</em></p></li></ul></td></tr></tbody></table><h2>Accessibility</h2><p>Must be readable by screen readers, use clear and plain language, and not rely on visual layout. If instructions are critical, they must be visible, not hidden in tooltips.</p></template>
<template data-page="commercial-communications"><h2>Commercial Messages</h2><p>Messages are considered commercial when they promote a product or feature, encourage additional usage, advertise services, or include marketing language. <strong>Examples:</strong> "Try our new payment feature," "Upgrade your account," promotional SMS campaigns. These must follow stricter compliance rules.</p><h2>Transactional Messages (Non-Commercial)</h2><p>Not considered commercial when they relate directly to a user's activity or account. Must remain neutral, informational, and free of promotional content. <strong>Examples:</strong> payment confirmations, billing reminders, security alerts, account updates.</p><h2>Unsubscribe / Opt-Out</h2><p>All commercial communications must include a clear and accessible unsubscribe mechanism.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>You can unsubscribe at any time using the link below.</em></p></li><li><p><em>Reply STOP to unsubscribe.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Hidden or unclear opt-out instructions</em></p></li><li><p><em>Requiring multiple steps to unsubscribe</em></p></li></ul></td></tr></tbody></table><h2>Accessibility Considerations</h2><p>Must be readable by screen readers, use clear and simple language, and avoid excessive formatting, symbols, all-caps, or decorative punctuation.</p><h2>Tone and Voice</h2><p>Remain neutral, clear, professional. Avoid overly promotional tone, urgency or pressure tactics, and emotional or exaggerated language.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Learn about new payment options available to you.</em></p></li><li><p><em>View available billing features.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Don't miss out!</em></p></li><li><p><em>Limited time only!</em></p></li><li><p><em>Act now!</em></p></li></ul></td></tr></tbody></table><h2>Consent Requirements</h2><p>Commercial messages must only be sent when the user has provided explicit or implied consent and the communication aligns with the consent given.</p><h2>Consent Language</h2><p>Must be clear, specific, and separate from other actions.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Receive email notifications about account activity</em></p></li><li><p><em>Receive promotional emails about new features</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Stay informed</em></p></li><li><p><em>Receive updates</em></p></li></ul></td></tr></tbody></table><h2>Clarity and Transparency</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>You are receiving this message because you opted in to receive updates about billing features.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Hey! Big news is waiting for you inside. Don't miss out!</em></p></li></ul></td></tr></tbody></table><h2>Identification Requirements</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>KUBRA Notifications</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>System message</em></p></li></ul></td></tr></tbody></table><h2>SMS (Pay-by-Text and Alerts)</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>KUBRA: Your payment of $125.00 is due on March 15. Reply STOP to unsubscribe.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Marketing-heavy SMS</em></p></li><li><p><em>Unclear sender identity</em></p></li></ul></td></tr></tbody></table><h2>Separation from Transactional Content</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Keep separate messages: payment confirmation (transactional), feature announcement (commercial)</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Your payment was successful. Check out our new features!</em></p></li></ul></td></tr></tbody></table></template>
<template data-page="pci-compliance"><h2>Sensitive Data (Do Not Expose)</h2><p>Must never be fully displayed or requested in plain text: full card number (PAN), CVV/security code, full bank account numbers, full routing numbers (outside secure input fields).</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>•••• •••• •••• 1234</em></p></li><li><p><em>Card ending in 1234</em></p></li><li><p><em>Account ending in 5678</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>4111 1111 1111 1234</em></p></li><li><p><em>Full card or account numbers in UI text</em></p></li></ul></td></tr></tbody></table><h2>Third-Party Payment Providers</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payments are processed securely through a third-party provider.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"We store your card for future use" (unless verified and compliant)</em></p></li></ul></td></tr></tbody></table><h2>Input Field Guidance</h2><p>Sensitive information must only be collected through secure, masked input fields and PCI-compliant components.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Label: Card number</em></p></li><li><p><em>Placeholder: **** **** **** 1234 (or blank, depending on system)</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Enter your full card number in the message box"</em></p></li><li><p><em>"Provide your card details below" (if unclear where/how)</em></p></li></ul></td></tr></tbody></table><h2>Accessibility Considerations</h2><p>Masked data must remain understandable when read aloud.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>"Card ending in one two three four"</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Read out masked symbols without context (e.g., "••••")</em></p></li></ul></td></tr></tbody></table><h2>Error Messaging and PCI</h2><p>Error messages must never reveal sensitive data.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>We couldn't process this card. Check the number and try again.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Card number 4111 1111 1111 1234 is invalid"</em></p></li></ul></td></tr></tbody></table><h2>Logging and Debugging Language</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Tell the user to contact support if the issue continues. Do not share your full card details.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>"Send us your card number so we can investigate"</em></p></li><li><p><em>"Paste your payment details here"</em></p></li></ul></td></tr></tbody></table><h2>Screenshots and UI Content</h2><p>Assume users may take screenshots, share screens, or save confirmations. Sensitive data should never appear fully visible in confirmations, receipts, or summaries.</p><h2>Payment Confirmations</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payment of $125.00 completed on August 27, 2026 using card ending in 1234.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Payment of $125.00 was made. Thank you!</em></p></li></ul></td></tr></tbody></table></template>
<template data-page="legal-content"><h2>Accuracy Overrides Style</h2><p>Legal meaning must never be altered for tone, brevity, or readability. Do not paraphrase legal text without approval; do not simplify language if it changes meaning; do not remove qualifiers (e.g., "may", "subject to", "up to"). If clarity and compliance conflict, escalate for legal review.</p><h2>Tone and Voice</h2><p>Legal content follows a more formal tone than UI copy. Neutral, precise, formal, non-conversational.</p><table data-width="760"><thead><tr><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #ffebe6"><ul><li><p><em>Friendly or casual phrasing</em></p></li><li><p><em>Marketing tone</em></p></li><li><p><em>Humor or reassurance</em></p></li></ul></td></tr></tbody></table><h3>Fees</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>A service fee of $2.50 will be added to this payment.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Additional fees may apply</em></p></li><li><p><em>A small fee may be charged</em></p></li></ul></td></tr></tbody></table><h2>Placement Guidelines</h2><p>Legal content should appear before the action it governs, close to the relevant interaction, and in a consistent location across flows.</p><h2>Separate Legal Content from UI Copy</h2><p>Should not be embedded inside field labels, buttons, toggle labels, or inline errors. Use helper text, linked documents, or dedicated sections or modals.</p><h2>Consent and Agreement Language</h2><p>Consent must be explicit, clear, unambiguous, and actionable.</p><h3>Timing</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payments will be processed on the due date.</em></p></li><li><p><em>Funds typically appear within 3–5 business days.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Soon</em></p></li><li><p><em>Shortly</em></p></li></ul></td></tr></tbody></table><h2>When to Escalate</h2><p>Escalate to legal or compliance teams when introducing new financial terms, modifying fee language, changing refund or cancellation policies, adjusting consent or authorization wording, or translating legal content. Do not independently rewrite legal text.</p><h2>Keep Legal Content Clear and Scannable</h2><p>Even when legally required, content should be structured, broken into sections, and easy to scan.</p><h3>Checkbox Pattern (Required)</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>I agree to the Terms and Conditions</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Agree</em></p></li><li><p><em>I accept</em></p></li></ul></td></tr></tbody></table><h2>Conditional Language</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>A late fee may apply if payment is not received by March 20.</em></p></li></ul></td></tr></tbody></table><h2>Common Mistakes to Avoid</h2><ul><li><p>Simplifying legal content without approval</p></li><li><p>Mixing legal and instructional text</p></li><li><p>Hiding legal content behind interactions</p></li><li><p>Using inconsistent terminology</p></li><li><p>Adding tone or personality to legal copy</p></li></ul><h2>Do Not Hide Legal Information</h2><p>Must be visible when relevant, accessible before user action, and not hidden behind tooltips or hover states.</p><h2>Linking Legal Documents</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Read the Terms and Conditions</em></p></li><li><p><em>View Privacy Policy</em></p></li></ul></td></tr></tbody></table><h2>Recurring Payments (Autopay)</h2><p>Content must clearly state that payments are automatic, when payments occur, and how to cancel.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Enable autopay — Helper text: Payments will be automatically processed on your due date each month.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Automatic payments enabled</em></p></li><li><p><em>Payments will be handled</em></p></li></ul></td></tr></tbody></table></template>
<template data-page="industry-specific-language"><h2>User-Familiar Terms (Preferred)</h2><p>Commonly understood by most users. <strong>Examples:</strong> card number, payment amount, billing address, due date, service fee. Require no explanation; standardized across the product.</p><h2>Financial Terminology</h2><h3>Amounts</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Payment amount</em></p></li><li><p><em>Amount due</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Total (if unclear what it includes)</em></p></li><li><p><em>Balance (unless defined)</em></p></li></ul></td></tr></tbody></table><h3>Fees</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts (vague terms)</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Service fee</em></p></li><li><p><em>Late fee</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Additional charges</em></p></li><li><p><em>Processing fee (unless defined and consistent)</em></p></li></ul></td></tr></tbody></table><h3>Timing</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Due date</em></p></li><li><p><em>Processing date</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Soon</em></p></li><li><p><em>Upcoming</em></p></li></ul></td></tr></tbody></table><h2>Semi-Technical Terms (Use with Care)</h2><p><strong>Examples:</strong> routing number, ACH (bank transfer), autopay, recurring payment. Add helper text if clarification is needed; avoid introducing multiple terms for the same concept.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Bank account (ACH)</em></p></li><li><p><em>Routing number — Helper text: A 9-digit number used to identify your bank.</em></p></li></ul></td></tr></tbody></table><h2>Utility-Specific Language</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Account number</em></p></li><li><p><em>Service address</em></p></li><li><p><em>Billing period</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Meter ID (unless required)</em></p></li><li><p><em>Service unit identifier</em></p></li></ul></td></tr></tbody></table><h2>Technical or Internal Terms (Avoid or Define)</h2><p><strong>Examples:</strong> PAN (Primary Account Number), CNAME, transaction division (TD), tokenization. Avoid in consumer-facing UI when possible; define on first use if required.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Card number (instead of PAN)</em></p></li><li><p><em>System configuration (CNAME) (only if necessary and defined)</em></p></li></ul></td></tr></tbody></table><h2>Do Not Expose Internal Language</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Use Instead</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Avoid</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>We couldn't process your card. Check the number and try again.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>PAN validation failed</em></p></li><li><p><em>TD configuration error</em></p></li><li><p><em>Tokenization mismatch</em></p></li></ul></td></tr></tbody></table></template>
<template data-page="copyright-and-trademarks"><h2>Always Use Official Names</h2><p>Do not modify names for readability or style, introduce new variations, or shorten/abbreviate unless officially defined.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Pay-by-Text</em></p></li><li><p><em>EZ-PAY</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Pay by Text</em></p></li><li><p><em>EZ Pay</em></p></li><li><p><em>EZ-Pay</em></p></li></ul></td></tr></tbody></table><h2>Trademark Symbols (™ and ®)</h2><p>Use in legal or formal documentation and at first mention in long-form content if required. Not in UI copy unless legally required.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>EZ-PAY</em></p></li><li><p><em>Pay-by-Text</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>EZ-PAY®</em></p></li><li><p><em>Pay-by-Text™</em></p></li></ul></td></tr></tbody></table><h2>Do Not Alter Trademarks</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Use EZ-PAY to manage your payments.</em></p></li><li><p><em>Payments can be made through Pay-by-Text.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>EZ-PAY your bill</em></p></li><li><p><em>Payments can be made through Pay-by-Texts</em></p></li></ul></td></tr></tbody></table><h2>Third-Party Trademarks</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>PayPal</em></p></li><li><p><em>Apple Pay</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Paypal</em></p></li><li><p><em>ApplePay</em></p></li></ul></td></tr></tbody></table><h2>Do Not Include Copyright in UI Copy</h2><p>Avoid placing copyright language in forms, buttons, error messages, or banners.</p><h2>Use Trademarks as Adjectives, Not Nouns or Verbs</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>EZ-PAY service</em></p></li><li><p><em>Pay-by-Text program</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Use EZ-PAY</em></p></li><li><p><em>Pay with Pay-by-Text</em></p></li></ul></td></tr></tbody></table><h2>Attribution (When Required)</h2><p><strong>Example:</strong> PayPal is a registered trademark of PayPal, Inc. — in legal or documentation sections, not UI.</p><h2>Accessibility Considerations</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>PayPal</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>PAYPAL (unless brand standard)</em></p></li></ul></td></tr></tbody></table><h2>Copyright</h2><p>Copyright notices should be included in footers, legal pages, and documentation. <strong>Example:</strong> © 2026 KUBRA. All rights reserved.</p></template>
<template data-page="abbreviations-and-acronyms"><h2>In User Interface (UI) Copy</h2><h3>Avoid abbreviations and acronyms by default</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Routing number</em></p></li><li><p><em>Card number</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>RTN</em></p></li><li><p><em>PAN</em></p></li></ul></td></tr></tbody></table><h3>Use only when widely recognized</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>SMS</em></p></li><li><p><em>PIN (if appropriate for your users)</em></p></li></ul></td></tr></tbody></table><h3>Do not introduce new acronyms in UI</h3><table data-width="760"><thead><tr><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #ffebe6"><ul><li><p><em>"Enter your TD"</em></p></li><li><p><em>"Configure CNAME settings"</em></p></li></ul></td></tr></tbody></table><h2>In Documentation and Help Content</h2><h3>Spell out on first use</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>System Usability Scale (SUS)</em></p></li><li><p><em>SUS results are reviewed quarterly (subsequent use)</em></p></li></ul></td></tr></tbody></table><h2>In Technical or Admin Interfaces</h2><p>Acronyms may be used more frequently, but must still be accurate, consistent, and defined if not universally understood.</p><h2>Time</h2><p>Use ET unless specifying daylight or standard time is necessary.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>a.m. / p.m.</em></p></li><li><p><em>ET (preferred for general use)</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Mixing EST/EDT unless accuracy is required</em></p></li></ul></td></tr></tbody></table><h2>Days and Months</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Mon, Tue, Jan, Feb (UI constraints)</em></p></li><li><p><em>Monday, January (long-form content)</em></p></li></ul></td></tr></tbody></table><h2>Currency</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>$125.00</em></p></li><li><p><em>CAD $125.00 (if needed for clarity)</em></p></li></ul></td></tr></tbody></table><h2>Avoid in Consumer UI</h2><table data-width="760"><thead><tr><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #ffebe6"><ul><li><p><em>PAN</em></p></li><li><p><em>TD</em></p></li><li><p><em>Internal system abbreviations</em></p></li></ul></td></tr></tbody></table></template>
<template data-page="product-naming-reference"><h2>Naming Rules</h2><h3>1. Use Exact Approved Formatting</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Pay-by-Text</em></p></li><li><p><em>EZ-PAY</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Pay by Text</em></p></li><li><p><em>EZ Pay</em></p></li><li><p><em>EZ-Pay</em></p></li></ul></td></tr></tbody></table><h3>2. Do Not Create Variations</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Retail Cash Payments</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Cash Payments</em></p></li><li><p><em>Retail Payments</em></p></li></ul></td></tr></tbody></table><h3>3. Do Not Modify for Sentence Flow</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Manage settings in Storm Center.</em></p></li><li><p><em>Use IncidentWatch to monitor events.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Manage settings in the storm center</em></p></li><li><p><em>Use Incident Watch</em></p></li></ul></td></tr></tbody></table><h3>4. Maintain Capitalization Everywhere</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Enable Pay-by-Text notifications.</em></p></li><li><p><em>Open Image Library.</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Enable pay-by-text notifications</em></p></li><li><p><em>Open image library</em></p></li></ul></td></tr></tbody></table><h2>Descriptor vs. Product Name</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Use as Product Name</strong></p></th><th style="background-color: #abf5d1"><p><strong>✅ Use as Descriptor</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Manage Payment Reminders in your settings.</em></p></li></ul></td><td style="background-color: #e3fcef"><ul><li><p><em>Enable payment reminders for your account.</em></p></li></ul></td></tr></tbody></table><h2>First Mention vs. Repeated Use</h2><p><strong>In UI Copy:</strong> use the full product name; do not abbreviate unless officially defined. <strong>In Documentation:</strong> use the full name on first mention; an acronym may follow.</p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Retail Cash Payments (RCP)</em></p></li><li><p><em>RCP (subsequent use)</em></p></li></ul></td></tr></tbody></table><h2>Integration with Canonical Copy</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Enable EZ-PAY</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Enable Ez Pay</em></p></li></ul></td></tr></tbody></table><h2>Accessibility Considerations</h2><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Pay-by-Text</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>PAY-BY-TEXT (unless required)</em></p></li></ul></td></tr></tbody></table></template>
<template data-page="decision-guidelines"><h2>Decision Hierarchy (Use This First)</h2><p>When making a decision, apply this order of priority — top to bottom:</p><table data-width="760"><thead><tr><th><p>Priority</p></th><th><p>Ask Yourself</p></th><th><p>Rule</p></th></tr></thead><tbody><tr><td style="background-color: #ffbdad"><p><strong>1. Accuracy</strong> (highest priority)</p></td><td style="background-color: #ffbdad"><p>Is the content factually and legally correct? Does it reflect how the system actually behaves?</p></td><td style="background-color: #ffbdad"><p>If not accurate, stop and escalate.</p></td></tr><tr><td style="background-color: #ffe0b2"><p><strong>2. Clarity</strong></p></td><td style="background-color: #ffe0b2"><p>Will the user understand this immediately? Does it reduce confusion and cognitive load?</p></td><td style="background-color: #ffe0b2"><p>Choose the clearest option, even if it is longer.</p></td></tr><tr><td style="background-color: #fff3bf"><p><strong>3. Risk</strong> (payments, legal, security)</p></td><td style="background-color: #fff3bf"><p>Does this affect money, consent, or account access? Could ambiguity create financial or legal issues?</p></td><td style="background-color: #fff3bf"><p>If yes, choose the most explicit and safest wording.</p></td></tr><tr><td style="background-color: #cce0ff"><p><strong>4. Consistency</strong></p></td><td style="background-color: #cce0ff"><p>Does this match existing patterns? Is this term already defined in the system?</p></td><td style="background-color: #cce0ff"><p>Prefer consistency over introducing new phrasing.</p></td></tr><tr><td style="background-color: #e0d4fd"><p><strong>5. Brevity</strong> (lowest priority)</p></td><td style="background-color: #e0d4fd"><p>Can this be shortened without losing meaning?</p></td><td style="background-color: #e0d4fd"><p>Never sacrifice clarity or accuracy for brevity.</p></td></tr></tbody></table><h2>Decision Framework (Step-by-Step)</h2><p>Use this when you're unsure what to write:</p><div data-type="panel-note"><p><strong>Step 1 — Identify the context</strong></p><ul><li><p>UI element (button, label, error, etc.)</p></li><li><p>User goal</p></li><li><p>Risk level (low vs. high)</p></li></ul></div><div data-type="panel-note"><p><strong>Step 2 — Check existing patterns</strong></p><ul><li><p>Canonical Copy Library</p></li><li><p>Terminology Registry</p></li><li><p>Similar UI components</p></li></ul><p><em>If a pattern exists → reuse it.</em></p></div><div data-type="panel-note"><p><strong>Step 3 — Apply the hierarchy</strong></p><ul><li><p>Is it accurate?</p></li><li><p>Is it clear?</p></li><li><p>Is it safe (especially for payments)?</p></li><li><p>Is it consistent?</p></li></ul></div><div data-type="panel-note"><p><strong>Step 4 — Choose the simplest valid option</strong></p><ul><li><p>Avoid overthinking phrasing</p></li><li><p>Avoid inventing new patterns</p></li></ul></div><div data-type="panel-note"><p><strong>Step 5 — Escalate if needed</strong></p><p>Escalate for review if the decision affects payments, legal/compliance, new terminology, or cross-product consistency.</p></div><h2>Common Decision Scenarios</h2><h3>Scenario 1: "Continue" vs. Specific CTA</h3><p><em>Why: Specificity reduces financial risk.</em></p><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Confirm payment</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Continue</em></p></li></ul></td></tr></tbody></table><h3>Scenario 2: Short vs. Clear</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Cancel scheduled payment</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Cancel</em></p></li></ul></td></tr></tbody></table><h3>Scenario 3: Technical vs. User-Friendly</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Card number</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>PAN</em></p></li></ul></td></tr></tbody></table><h3>Scenario 4: Friendly vs. Neutral Tone</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Enter your payment details</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>Let's get started</em></p></li></ul></td></tr></tbody></table><h3>Scenario 5: Acronym vs. Full Term</h3><table data-width="760"><thead><tr><th style="background-color: #abf5d1"><p><strong>✅ Do's</strong></p></th><th style="background-color: #ffbdad"><p><strong>❌ Don'ts</strong></p></th></tr></thead><tbody><tr><td style="background-color: #e3fcef"><ul><li><p><em>Routing number</em></p></li></ul></td><td style="background-color: #ffebe6"><ul><li><p><em>RTN</em></p></li></ul></td></tr></tbody></table><h2>When to Reuse vs. Create New Copy</h2><p><strong>Reuse when:</strong> the same action exists elsewhere, a canonical pattern exists, or the meaning is identical. <strong>Create new copy when:</strong> the action is new, the context is meaningfully different, or reusing would create confusion.</p></template>
<template data-page="writing-resources"><p>This page collects supporting references and related resources for KUBRA writers — glossaries of platform terminology, the broader UX Writing team space, and other supporting documents.</p><table data-width="760"><thead><tr><th><p>Resource</p></th><th><p>Description</p></th></tr></thead><tbody><tr><td style="background-color: #cce0ff"><p><a href="https://kubra.jira.com/wiki/spaces/confighqdocs/pages/484508368" target="_blank" rel="noopener">16.0 Glossary</a></p></td><td style="background-color: #cce0ff"><p>KUBRA platform terminology (islands, payables, funding source types, and more), each with a content expert of record.</p></td></tr><tr><td style="background-color: #c3fae8"><p><a href="https://kubra.jira.com/wiki/spaces/PT/pages/2001010750" target="_blank" rel="noopener">KUBRA HQ Glossary of Terms</a></p></td><td style="background-color: #c3fae8"><p>The company-wide glossary of terms and acronyms, organized alphabetically with reviewers for each entry.</p></td></tr><tr><td style="background-color: #e0d4fd"><p><a href="https://kubra.jira.com/wiki/spaces/CD/pages/63668331" target="_blank" rel="noopener">UX Writing</a></p></td><td style="background-color: #e0d4fd"><p>The UX Writing team's home space, with team contacts and links to the broader Content Design System.</p></td></tr><tr><td style="background-color: #ffe8cc"><p><a href="https://docs.google.com/document/d/10fRrxQS5yfWcrxQM3-HW9ytJeZdZZpAMpa9lOWTyeJU/edit?usp=sharing" target="_blank" rel="noopener">Supporting Google Doc</a></p></td><td style="background-color: #ffe8cc"><p>Additional supporting reference material.</p></td></tr></tbody></table></template>
