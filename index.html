<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUBRA Content Style Guide</title>
<meta name="description" content="Interactive, searchable KUBRA content style guide — voice, tone, accessibility, forms, system messages, compliance, and reference.">

<body>

<div id="templates" hidden></div>

<header class="app-header">
  <button class="icon-btn menu-toggle" id="menuToggle" type="button" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false" data-icon="menu"></button>
  <a class="brand" href="#overview" data-route="overview" aria-label="KUBRA Content Style Guide home">
    <span class="brand-word">KUBRA</span>
    <span class="brand-divider" aria-hidden="true"></span>
    <span class="brand-title">Content Style Guide</span>
    <span class="brand-version">2.0</span>
  </a>
  <div class="search" id="search" role="search">
    <span class="search-icon" data-icon="search"></span>
    <input id="searchInput" type="search" placeholder="Search guidelines" autocomplete="off" aria-label="Search the style guide">
    <kbd class="search-kbd" id="searchKbd">/</kbd>

<div class="app">

      <span class="footer-links"><a href="#changelog" data-route="changelog">Changelog</a><a href="https://kubra.jira.com/wiki/spaces/CD/pages/2016313568/Style+Guide+2.0" target="_blank" rel="noopener">Edit source in Confluence</a></span>
    </footer>

<script src="app.js"></script>
